# Catalyst application manifest — Fire Allowance Tracker
#
# Machine-readable identity and routing metadata for this application.
# Every field below is established from evidence inside this repository;
# fields that could not be established honestly are omitted rather than guessed.
#
# Authority: this manifest states WHERE things live (repo, branches, hosting,
# database, Linear routing). CLAUDE.md states HOW work is done. Where a routing
# fact appears in both, this manifest is the machine-readable source and
# CLAUDE.md must agree with it.

schema: catalyst/app@1

id: fire-allowance-tracker
name: Fire Allowance Tracker

# owner/repo exactly as GitHub renders it — the canonical catalyst/app@1 string
# shape that the governance locator compares by equality (GOV-327). The repository
# was transferred to Tinnaz45 under APP-116.
repository: Tinnaz45/fire-allowance-tracker
repository_visibility: public

# Normal two-branch application: ordinary work lands on `dev` via PR;
# `main` is production and is reached only by explicitly approved promotion.
branches:
  model: dev-main
  dev: dev
  production: main

stack:
  framework: nextjs
  package_manager: npm

hosting:
  provider: vercel
  production_branch: main
  preview: pull-request

database:
  provider: supabase
  # Established from repository evidence, not assumption:
  #   - lib/supabaseClient.js            → supabase.schema('fat')
  #   - app/api/payslip/extract/route.js → db: { schema: 'fat' }
  #   - supabase/fat-schema.sql          → create schema if not exists fat
  #   - docs/FAT_SCHEMA_ARCHITECTURE.md  → every FAT-owned object lives in `fat`
  # The string "fire_allowance_tracker" does not appear anywhere in this
  # repository as a schema reference. The separate `fire_allowance_tracker`
  # schema observed in PROD is not read or written by this application; its
  # disposition is tracked in Linear WORK-144 / WORK-145 (successors to the
  # deleted GOV-8 / GOV-308 cleanup Issues) and is out of scope here.
  schema: fat
  # DEV and PROD are separate Supabase projects — see CLAUDE.md §7.
  # The `fat` schema must remain exposed to PostgREST.

# GOV-409 renamed the Applications team (key APP) to Workshop (key WORK).
# Historical APP-<n> identifiers still resolve to the same Issues.
linear:
  team: Workshop
  team_key: WORK
  # Applied to every Issue that owns work in this repository.
  app_label: Fire Allowance Tracker

chatgpt:
  # Declares this app's existing ChatGPT Project identity (WORK-110, formerly
  # APP-110). governance_mode is deliberately omitted: its absence resolves as
  # LEGACY until WORK-110 completes the LIVE migration.
  project: Fire Allowance Tracker
  eligible: true

instructions:
  agent: CLAUDE.md
  rules: .claude/rules.md
  docs: docs/
